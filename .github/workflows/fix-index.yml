name: Fix Hub HTML

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove accidental Markdown fences
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines(keepends=True)
          bad = {'```html', '```javascript', '```'}
          cleaned = ''.join(line for line in lines if line.strip() not in bad)
          if cleaned != text:
              p.write_text(cleaned, encoding='utf-8')
              print('Removed accidental Markdown fence lines.')
          else:
              print('No Markdown fence lines found.')
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          Path('/tmp/app.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/app.js

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix accidental markdown fences in index'
            git push
          fi

      - name: Remove one-time workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-index.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Workflow already removed.'
          else
            git commit -m 'Remove one-time repair workflow'
            git push
          fi
